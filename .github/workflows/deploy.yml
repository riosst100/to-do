name: CI / Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"  # same as php8.4-fpm on the VPS
          extensions: pdo_sqlite, pdo_pgsql, zip, pcntl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      # phpunit.xml switches the database to in-memory SQLite
      - run: php artisan test

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen   # PageProps/LayoutProps globals (normally created by next dev/build)
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

  deploy:
    name: Deploy to VPS
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            # Non-interactive SSH skips .bashrc; load nvm/pm2 if installed that way.
            export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd "${{ vars.APP_DIR || '/var/www/html/to-do' }}"
            git fetch --prune origin master
            git reset --hard origin/master
            PM2_APP_NAME="${{ vars.PM2_APP_NAME || 'todo-web' }}" \
            FRONTEND_PORT="${{ vars.FRONTEND_PORT || '3030' }}" \
              bash scripts/deploy.sh
