name: todo-app

services:
  backend:
    build: ./docker/backend
    image: todo-app-backend:dev
    entrypoint: ["backend-entrypoint"]
    command: ["serve"]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      APP_URL: http://localhost:${BACKEND_PORT:-8020}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3020}}
      # Shared PostgreSQL from ~/projects/services (start it first).
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-todo}
      DB_USERNAME: ${POSTGRES_USER:-todo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      # 0.0.0.0 agar bisa diakses HP/emulator di jaringan yang sama (versi mobile)
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8020}:8000"
    networks:
      - default
      - services
    healthcheck:
      test: ["CMD-SHELL", "test -f storage/framework/.todo-ready && php -r 'exit(@file_get_contents(\"http://127.0.0.1:8000/up\") ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: node:24-bookworm-slim
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: ["sh", "-c", "[ -d node_modules/next ] || npm install; exec npm run dev -- --hostname 0.0.0.0 --port 3000"]
    volumes:
      - ./frontend:/app
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      NEXT_TELEMETRY_DISABLED: 1
      # Dipanggil dari browser, jadi pakai port host, bukan hostname Docker
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8020}/api
      # Hot reload untuk file yang diedit dari WSL/Windows
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3020}:3000"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  services:
    external: true
